# Every push and pull request: lint, unit tests and the static build Cloudflare Pages serves.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Prettier isn't enforced yet: most files predate the config (`bun run format` once, then switch to `bun run lint`)
      - run: bunx eslint .
      - run: bun run test
      - run: bun run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: build
          retention-days: 7
